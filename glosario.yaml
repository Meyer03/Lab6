  SC: ""                                # ? desconocido
  CER: ""                               # ? desconocido

# Códigos que no son sede ni área (se ignoran)
ignorar_codigos: [TE]

# ------------------------------------------------------------
# 4. Ruido: turnos que no aportan nada
#    Un turno se descarta si TODAS sus palabras están en esta lista
#    (y no trae números ni responde a una pregunta del turno anterior).
#    OJO: "yes" y "no" van entre comillas; sin ellas YAML los lee como verdadero/falso.
# ------------------------------------------------------------
muletillas_turno:
  [okay, ok, o, k, "yes", sí, si, "no", gracias, thank, thanks, you, hola, hello, buenos, buenas,
   buen, días, dias, día, dia, tardes, listo, va, vale, mhm, ajá, aja, eh, em, este, bueno,
   perfecto, excelente, claro, correcto, órale, orale, a, todos, muchas, muchísimas, equipo,
   adiós, bye, perdón, ah, oh, ohh, mm, mmm, hmm, sale, de, acuerdo, gracia, igualmente,
   que, tengan, tenga, qué, tal, pues, totalmente, exacto, así, es]

# Muletillas que se borran DENTRO de un turno (palabra suelta)
muletillas_dentro: [eh, em, mmm, mhm, ehh]
