# ============================================================
#  GLOSARIO — correcciones del dominio para la limpieza (etapa 3)
# ============================================================
# Este archivo es de DATOS: se edita sin tocar código.
# Después de editarlo: python ingest.py --dry-run   y revisa el resultado.
# Las entradas con "?" son deducciones que falta confirmar.

# ------------------------------------------------------------
# 1. Correcciones de transcripción (errores que se repiten)
#    clave = expresión regular (sin distinguir mayúsculas), valor = reemplazo
# ------------------------------------------------------------
correcciones:
  '\bseguridad veal\b': seguridad vial
  '\badonas?\b': aduana            # "Adona de Colombia" = Aduana de Colombia (N.L.)
  '\bwalman\b': Walmart
  '\bsumestro\b': siniestro
  '\breflejado\b': refrigerado      # "en reflejado traemos siete unidades"
  '\bcross[ -]border\b': Crossborder
  '\bpre[ -]viajes?\b': previaje
  '\bo k\b': OK

# ------------------------------------------------------------
# 2. Alias de personas: la misma persona escrita distinto
#    (Teams usa el nombre de la cuenta; los .txt el nombre hablado)
#    Antes de buscar aquí, el código ya cambia "Luis.Palacios" → "Luis Palacios"
#    y quita espacios dobles.
# ------------------------------------------------------------
alias_hablantes:
  Careli: Karely Cortazar
  Carelli: Karely Cortazar
  Dulce Cruz: Dulce Wendy Cruz Flores
  Luis Nájera: Luis Adrian Najera Eguia
  Esmeralda: Esmeralda Ortiz           # ? en la junta de Dedicados del 17/07

# ------------------------------------------------------------
# 3. Códigos de Teams: "(TE, QRO, OP)" = empresa, sede, área
# ------------------------------------------------------------
sedes:
  QRO: Querétaro
  CAL: Calamanda
  NLD: Nuevo Laredo
  GDL: Guadalajara
  CMX: Ciudad de México
  MTY: Monterrey
  SLP: San Luis Potosí
  SAL: Saltillo
  SJI: San Juan ?                        # ? confirmar

areas:
  OP: Operaciones
  OPE: Operaciones
  EO: Excelencia Operativa
  MT: Mantenimiento
  RH: Capital Humano
  HR: Capital Humano
  PL: Planeación
  TR: Transfer
  TC: Tráfico y Control ?                # ? Jonathan López reporta cumplimiento de viajes
  COM: Comercial / Servicio al Cliente
  CM: Comercial / Servicio al Cliente    # ?
  DG: Dirección de UN                    # Pablo Gálvez, líder de UN
  COB: Cobranza
